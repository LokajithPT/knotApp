name: knot_app
description: A personal knowledge graph app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  record: ^6.0.0
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "mainshit.png"
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "mainshit.png"